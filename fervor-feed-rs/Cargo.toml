[package]
name = "fervor-feed-rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
archive-replay = [
    "dep:bincode",
    "dep:cid",
    "dep:crc",
    "dep:fnv",
    "dep:rayon",
    "dep:serde_cbor",
    "dep:solana-transaction",
    "dep:zstd",
]

[dependencies]
anyhow = "1"
bincode = { version = "1.3.3", optional = true }
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
cid = { version = "=0.11.3", optional = true }
clap = { version = "4", features = ["derive", "env"] }
crc = { version = "3", optional = true }
fnv = { version = "1", optional = true }
hex = "0.4"
hdrhistogram = "7"
futures-util = "0.3"
fs2 = "0.4"
native-tls = "0.2"
postgres-native-tls = "0.5"
prost = "0.14"
redis = { version = "0.27", features = ["tokio-comp"] }
rayon = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = { version = "0.11", optional = true }
serde_json = "1"
sha2 = "0.10"
solana-transaction = { version = "=3.0.2", features = ["bincode"], optional = true }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
url = "2"
prost-types = "0.14"
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto = { version = "12.2.0", default-features = false, features = ["tonic", "tonic-compression"] }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"

[[bin]]
name = "fervor-alert-matcher"
path = "src/bin/alert_matcher.rs"

[[bin]]
name = "fervor-market-indexer"
path = "src/bin/market_indexer.rs"

[[bin]]
name = "fervor-corpus"
path = "src/bin/corpus.rs"

[[bin]]
name = "fervor-replay"
path = "src/bin/replay.rs"
required-features = ["archive-replay"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
