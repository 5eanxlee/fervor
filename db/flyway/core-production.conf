flyway.initSql=SET statement_timeout = '60s'; DO $fervor$ BEGIN IF NOT pg_try_advisory_lock(1937006964, 1) THEN RAISE EXCEPTION 'fervor migration lock unavailable' USING ERRCODE = '55P03'; END IF; END $fervor$; DO $roles$ DECLARE runtime_oid OID; maintenance_oid OID; parent_name TEXT; hardened BOOLEAN; BEGIN SELECT oid INTO runtime_oid FROM pg_catalog.pg_roles WHERE rolname = 'core_runtime' AND NOT rolsuper AND NOT rolcreaterole AND NOT rolcreatedb AND NOT rolreplication AND NOT rolbypassrls; SELECT oid INTO maintenance_oid FROM pg_catalog.pg_roles WHERE rolname = 'core_maintenance' AND NOT rolsuper AND NOT rolcreaterole AND NOT rolcreatedb AND NOT rolreplication AND NOT rolbypassrls; IF runtime_oid IS NULL OR maintenance_oid IS NULL THEN RAISE EXCEPTION 'required core transaction roles are missing or unsafe' USING ERRCODE = '42501'; END IF; WITH RECURSIVE parents(root_oid, role_oid) AS (SELECT member, roleid FROM pg_catalog.pg_auth_members WHERE member IN (runtime_oid, maintenance_oid) UNION SELECT parents.root_oid, membership.roleid FROM parents JOIN pg_catalog.pg_auth_members membership ON membership.member = parents.role_oid) SELECT role.rolname INTO parent_name FROM parents JOIN pg_catalog.pg_roles role ON role.oid = parents.role_oid ORDER BY role.rolname LIMIT 1; IF parent_name IS NOT NULL THEN RAISE EXCEPTION 'core transaction roles must not inherit or set parent role %', parent_name USING ERRCODE = '42501'; END IF; IF pg_catalog.to_regclass('fervor_core_meta.fervor_core_history') IS NOT NULL THEN EXECUTE 'SELECT EXISTS (SELECT 1 FROM fervor_core_meta.fervor_core_history WHERE version = ''055'' AND success)' INTO hardened; IF hardened THEN IF pg_catalog.to_regprocedure('public.assert_tx_roles()') IS NULL THEN RAISE EXCEPTION 'transaction role catalog assertion is missing' USING ERRCODE = '42501'; END IF; PERFORM public.assert_tx_roles(); END IF; END IF; END $roles$
