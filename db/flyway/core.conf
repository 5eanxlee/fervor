flyway.locations=filesystem:/flyway/db/core/migrations
flyway.table=fervor_core_history
flyway.defaultSchema=fervor_core_meta
flyway.schemas=fervor_core_meta
flyway.createSchemas=true
flyway.encoding=UTF-8
flyway.failOnMissingLocations=true
flyway.placeholderReplacement=false
flyway.validateMigrationNaming=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
flyway.postgresql.transactional.lock=false
flyway.lockRetryCount=50
flyway.connectRetries=10
flyway.connectRetriesInterval=2
flyway.initSql=SET statement_timeout = '60s'; DO $fervor$ BEGIN IF NOT pg_try_advisory_lock(1937006964, 1) THEN RAISE EXCEPTION 'fervor migration lock unavailable' USING ERRCODE = '55P03'; END IF; END $fervor$
